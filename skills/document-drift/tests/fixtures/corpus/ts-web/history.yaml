  - author: "Linus Pauling <linus@example.com>"
    date: "2025-04-01T09:00:00+00:00"
    subject: "feat: config, item client, helpers and the app shell"
    files:
      package.json: "@final"
      src/config.ts: "@final"
      src/helpers/format.ts: "@final"
      src/App.tsx: "@final"
      src/main.tsx: "@final"
      src/api/client.ts: |
        import { config } from "../config";

        export const PAGE_SIZE = 50;

        export interface Item {
          id: string;
          name: string;
          priceCents: number;
        }

        export async function fetchItems(page = 1): Promise<Item[]> {
          const url = `${config.apiUrl}/api/items?page=${page}&size=${PAGE_SIZE}`;
          const response = await fetch(url);
          return (await response.json()) as Item[];
        }

        export async function fetchItem(id: string): Promise<Item> {
          const response = await fetch(`${config.apiUrl}/api/items/${id}`);
          return (await response.json()) as Item;
        }
      src/pages/ItemsPage.tsx: |
        import { useEffect, useState } from "react";
        import { fetchItems, type Item } from "../api/client";
        import { formatPrice } from "../helpers/format";

        export function ItemsPage() {
          const [items, setItems] = useState<Item[]>([]);
          useEffect(() => {
            fetchItems().then(setItems);
          }, []);
          return (
            <ul>
              {items.map((item) => (
                <li key={item.id}>
                  {item.name}: {formatPrice(item.priceCents)}
                </li>
              ))}
            </ul>
          );
        }
