[project]
name = "tech-debt-scan-skill"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["skills/tech-debt-scan/tests", "skills/karate-bootstrap/tests"]
markers = ["live: hits a real LLM (off by default)"]
addopts = "-m 'not live'"
# The corpus fixture trees legitimately contain files named test_*.py (they
# are fixture content, not tests of this project); keep pytest from trying
# to collect and import them.
norecursedirs = ["fixtures/corpus"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Fixture repos under every skill's tests/fixtures are data, not project code.
extend-exclude = ["skills/tech-debt-scan/tests/fixtures/corpus", "skills/*/tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["skills/tech-debt-scan/scripts", "skills/karate-bootstrap/scripts"]
# scripts/ are direct-path-invocable (no package), so sibling imports like
# `from validation import ...` need the scripts dir on the mypy search path.
mypy_path = "skills/tech-debt-scan/scripts,skills/karate-bootstrap/scripts"
