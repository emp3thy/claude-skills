    date: "2024-03-04T09:00:00+00:00"
    subject: "feat: cli skeleton"
    files:
      go.mod: "@final"
      Makefile: ".PHONY: build vet test\n\nbuild:\n\tgo build -o bin/drift ./cmd/drift\n\nvet:\n\tgo vet ./...\n\ntest:\n\tgo test ./...\n"
      cmd/drift/main.go: "@final"
      internal/cli/flags.go: "package cli\n\nimport \"flag\"\n\n// Run parses the command line options and returns an exit code.\nfunc Run(args []string) int {\n\tfs := flag.NewFlagSet(\"drift\", flag.ContinueOnError)\n\tif err := fs.Parse(args); err != nil {\n\t\treturn 2\n\t}\n\treturn 0\n}\n"
      internal/store/store.go: "package store\n\n// Store keeps the cursor of the last run.\ntype Store struct {\n\tPath string\n}\n"
      internal/store/bolt.go: "package store\n\n// OpenBolt opens the bbolt database that backs a Store.\nfunc OpenBolt(path string) (*Store, error) {\n\treturn &Store{Path: path}, nil\n}\n"
      internal/report/csv.go: "package report\n\nimport \"encoding/csv\"\n\n// CSV is the first reporter; it writes one row per finding.\nvar CSV = csv.NewWriter\n"
