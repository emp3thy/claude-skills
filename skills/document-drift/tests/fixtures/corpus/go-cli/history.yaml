      internal/report/table.go: "@final"
      internal/compat/v1shim.go: "package compat\n\n// Translate rewrites version 1 flags into their current spelling.\nfunc Translate(args []string) []string {\n\treturn args\n}\n"
  - author: "Ken Thompson <ken@example.com>"
