      src/svc/storage.py: "@final"
      src/svc/legacy_cache.py: |
        """In-memory response cache (superseded by storage)."""
        CACHE: dict[str, bytes] = {}


        def get(key: str) -> bytes | None:
            return CACHE.get(key)
      src/svc/old_auth.py: |
        """Bearer-token authentication for every request."""


        def check(token: str) -> bool:
            return token.startswith("svc-")
